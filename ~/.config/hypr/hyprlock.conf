# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/background.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}


# Day
label {
    monitor =
    text = cmd[update:1000] date +"%A" | sed 's/^./\U&/'
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = SF Pro Display Bold
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] date +"%d de %B" | sed 's/de \(.\)/de \U\1/'
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"- %H:%M -"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 190
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = $HOME/.config/hypr/avatar.png
    border_size = 2
    border_color = rgba(255, 255, 255, .65)
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Contrazeña</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}
# Reboot
label {
    monitor =
    text = - 󰜉 -
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = reboot now
    position = -220, 100
    halign = center
    valign = bottom
    font_family = JetBrainsMono Nerd Font
}

# Power off
label {
    monitor =
    text = - 󰐥 -
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = shutdown now
    position = 0, 100
    halign = center
    valign = bottom
    font_family = JetBrainsMono Nerd Font
}

# Suspend
label {
    monitor =
    text = - 󰤄 -
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = systemctl suspend
    position = 220, 100
    halign = center
    valign = bottom
    font_family = JetBrainsMono Nerd Font
}
